name: Eira Two-Hemisphere Voice iPhone

on:
  workflow_dispatch:
  push:
    branches:
      - eira-two-hemisphere-voice
  pull_request:
    branches:
      - master

jobs:
  build-iphone:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Verify and apply native Eira voice bridge
        run: |
          python3 -m py_compile tools/eira_voice_patch.py
          python3 tools/eira_voice_patch.py
          grep -q 'EIRA-SPEAK' app/terminal/term.js
          grep -q 'native.eiraReady' app/terminal/term.js
          grep -q 'SFSpeechRecognizer' app/TerminalView.m
          grep -q 'speakEiraText' app/TerminalView.m
          grep -q 'EIRA_TYPED_INPUT_PAUSES_MIC' app/TerminalView.m
          grep -q 'NSMicrophoneUsageDescription' app/Info.plist
          grep -q 'NSSpeechRecognitionUsageDescription' app/Info.plist
          plutil -lint app/Info.plist

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH \
            -arch arm64 \
            -sdk iphoneos \
            -derivedDataPath build-eira-voice \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Eira voice iSH
        uses: actions/upload-artifact@v7
        with:
          name: ish-eira-voice-or-type-two-hemisphere
          path: build-eira-voice/Build/Products/*-iphoneos/iSH.app
          if-no-files-found: error
