name: Build EIRA V8 Apple USDZ

on:
  push:
    paths:
      - 'tools/build_eira_v8_usdz.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build V8 USDZ
        run: python tools/build_eira_v8_usdz.py
      - name: Commit V8 USDZ
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add eira2_transport_bus/to_superprobe/artifacts/EIRA2_LIVING_NEURAL_ORGANISM_V8.usdz
          git diff --cached --quiet || git commit -m 'Build EIRA V8 Apple USDZ artifact'
          git push
