name: Eira Inventor V8 CI

on:
  push:
    branches:
      - eira-inventor-holographic-lab-v8-visual-sandbox
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile package
        run: python -m compileall -q eira_inventor_holographic_lab tests
      - name: Run unit and integration tests
        run: pytest -q
      - name: Run 300-case geometry regression suite
        run: python tests/regression_300.py
      - name: Run 300-case quality regression suite
        run: python tests/regression_300_quality.py
