<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIRA Holographic Lab</title>
<style>body{margin:0;background:#071014;color:#e8f5f7;font:16px -apple-system,sans-serif}main{display:grid;grid-template-columns:260px 1fr 300px;gap:10px;padding:10px}.p{background:#0d1a20;border:1px solid #29434d;border-radius:16px;padding:12px}canvas{width:100%;height:62vh;background:#03080a;border-radius:12px}button,input,textarea,select{background:#0c1b20;color:#e8f5f7;border:1px solid #29434d;border-radius:10px;padding:9px;margin:3px}textarea{width:96%;min-height:70px}.row{display:flex;flex-wrap:wrap}.part{display:block;width:100%}#log{height:230px;overflow:auto}.msg{padding:7px;border-bottom:1px solid #173039}@media(max-width:900px){main{grid-template-columns:1fr}canvas{height:50vh}}</style>
<main><section class="p"><h2>Inventor's Archive</h2><input id="title" placeholder="Invention title"><textarea id="desc" placeholder="Intent, design, constraints"></textarea><button id="create">Create</button><label>Add files <input id="files" type="file" multiple accept="image/*,.glb,.gltf,.pdf"></label><div id="archive"></div></section>
<section class="p"><canvas id="view"></canvas><div class="row"><button id="play">▶ Play</button><button id="explode">Explode</button><button id="assemble">Reassemble</button><button id="isolate">Isolate</button><button id="show">Show all</button><label>Open 3D <input id="model" type="file" accept=".glb,.gltf"></label><select id="mode"><option value="faithful_concept">Faithful</option><option value="engineering_completion">Engineering</option><option value="scientific_plausibility">Scientific</option><option value="presentation">Presentation</option></select><button id="render">Render / Analyze</button></div><input id="range" type="range" min="0" max="3" step=".05" value="0"></section>
<section class="p"><h2>EIRA</h2><div class="row"><button id="voice">🎙 Voice</button><button id="mute">🔊 Speech</button></div><div id="selected">Selected: none</div><div id="parts"></div><div id="log"></div><textarea id="message" placeholder="Talk to EIRA about this design"></textarea><button id="send">Send</button><p>Inferred engineering gaps remain labeled as inferred or speculative.</p></section></main>
<script type="module">
const $=x=>document.getElementById(x),api=async(p,m='GET',b)=>{let r=await fetch(p,{method:m,headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):null});return r.json()};let current,muted=false,world,selected,mixer,playing=false,parts=[],base=new Map();
function log(a,b){let d=document.createElement('div');d.className='msg';d.textContent=a+': '+b;$('log').append(d)}
async function refresh(){let a=await api('/api/inventions');$('archive').innerHTML='';a.forEach(x=>{let b=document.createElement('button');b.className='part';b.textContent=x.title;b.onclick=()=>current=x.id;$('archive').append(b)})}
$('create').onclick=async()=>{let x=await api('/api/inventions','POST',{title:$('title').value,description:$('desc').value});current=x.id;refresh()};
$('files').onchange=async e=>{if(!current)return alert('Select an invention first');for(let f of e.target.files){let d=await new Promise(ok=>{let r=new FileReader;r.onload=()=>ok(String(r.result).split(',')[1]);r.readAsDataURL(f)});let a=await api('/api/upload','POST',{invention_id:current,name:f.name,mime:f.type,data_base64:d});if(/\.(glb|gltf)$/i.test(f.name))load3d(a.url)}};
$('render').onclick=async()=>{if(!current)return alert('Select an invention first');let j=await api('/api/render','POST',{invention_id:current,mode:$('mode').value});let r=await api('/api/render/process','POST',{});log('Engineering 3D',r.ok?'Completed '+j.job_id:(r.error||'failed'))};
async function send(){let t=$('message').value.trim();if(!t)return;$('message').value='';log('You',t);let r=await api('/api/chat','POST',{message:t}),o=r.response||'No response';log('EIRA',o);if(!muted&&speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(o))}}$('send').onclick=send;
$('mute').onclick=()=>{muted=!muted;if(muted)speechSynthesis?.cancel();$('mute').textContent=muted?'🔇 Muted':'🔊 Speech'};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let r=new SR();r.onresult=e=>{$('message').value=e.results[0][0].transcript;send()};$('voice').onclick=()=>r.start()}else $('voice').disabled=true;
try{const T=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/+esm'),{OrbitControls}=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js/+esm'),{GLTFLoader}=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js/+esm');let c=$('view'),ren=new T.WebGLRenderer({canvas:c,antialias:true}),s=new T.Scene(),cam=new T.PerspectiveCamera(45,1,.01,10000),ctl=new OrbitControls(cam,c),clock=new T.Clock();cam.position.set(3,2,5);s.add(new T.HemisphereLight(0xffffff,0x223344,3));window.load3d=async u=>{let g=await new GLTFLoader().loadAsync(u);if(world)s.remove(world);world=g.scene;s.add(world);parts=[];base.clear();$('parts').innerHTML='';world.traverse(o=>{if(o.isMesh){parts.push(o);base.set(o.uuid,o.position.clone());let b=document.createElement('button');b.className='part';b.textContent=o.name||'Part '+parts.length;b.onclick=()=>{selected=o;$('selected').textContent='Selected: '+b.textContent};$('parts').append(b)}});mixer=g.animations.length?new T.AnimationMixer(world):null;if(mixer)g.animations.forEach(a=>mixer.clipAction(a));};$('model').onchange=e=>e.target.files[0]&&load3d(URL.createObjectURL(e.target.files[0]));function ex(v){if(!world)return;let ctr=new T.Box3().setFromObject(world).getCenter(new T.Vector3());parts.forEach(o=>{let q=base.get(o.uuid),w=new T.Vector3();o.getWorldPosition(w);o.position.copy(q).add(w.sub(ctr).normalize().multiplyScalar(v))})}$('explode').onclick=()=>ex(1.2);$('assemble').onclick=()=>ex(0);$('range').oninput=e=>ex(+e.target.value);$('isolate').onclick=()=>selected&&parts.forEach(o=>o.visible=o===selected);$('show').onclick=()=>parts.forEach(o=>o.visible=true);$('play').onclick=()=>{if(!mixer)return;playing=!playing;mixer._actions.forEach(a=>playing?a.reset().play():a.stop())};(function loop(){requestAnimationFrame(loop);let w=c.clientWidth,h=c.clientHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();ctl.update();if(mixer&&playing)mixer.update(clock.getDelta());else clock.getDelta();ren.render(s,cam)})()}catch(e){log('3D',e.message)}refresh();
</script>
