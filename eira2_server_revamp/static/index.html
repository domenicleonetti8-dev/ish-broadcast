</style></head><body><div class="shell"><div class="top"><div class="brand"><h1>EIRA 2.0</h1><small><span id="statusDot" class="dot"></span><span id="headline">QUALIFYING SERVER</span></small></div><div class="actions"><button class="btn gold" id="arBtn">APPLE AR</button><button class="btn violet" id="inventBtn">INVENTION LAB</button></div></div><div class="grid"><section class="card brainCard" id="brainCard"><div class="orbGlow"></div><div class="brainHeader"><div><div class="eyebrow">360° LIVE NEURAL ORGANISM</div><div id="brainState">WAITING FOR CANONICAL INVENTORY</div></div><div class="metric"><span id="neurons">0</span> NEURONS<br><strong><span id="fibers">0</span> EVIDENCED FIBERS</strong></div></div><canvas id="brain"></canvas><div id="nodeLabel" class="nodeLabel"></div></section><aside class="card side"><div class="title"><h2>Live Conversation</h2><span id="activePill" class="pill">INACTIVE</span></div><div class="actions"><button id="activateBtn" class="btn">ACTIVATE EIRA</button><button id="muteBtn" class="btn">MUTE</button></div><div id="log" class="log"><p class="msg eira"><span class="who">Eira</span>I’m here.</p></div><form id="form" class="compose"><input id="input" autocomplete="off" placeholder="Ask Eira anything…"><button class="btn" type="submit">SEND</button></form><div><div class="eyebrow">BRIDGE MATRIX</div><div id="runtime" class="runtime"></div></div><div class="notice">The neural field stays clean. Tap a neuron to identify it; labels disappear automatically.</div></aside></div></div><script>
const $=s=>document.querySelector(s),log=$('#log');let state={active:false,muted:false},neural={nodes:[],fibers:[],activity:[]},micStream=null,speakTimer=null,topology={graph:new Map(),cores:[],paths:[],activity:new Map(),pathNodes:new Map(),pathEdges:new Set(),canonical:new Set()},screenNodes=[];const reducedMotion=matchMedia?.('(prefers-reduced-motion: reduce)')?.matches||false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function acquireMic(){if(micStream&&micStream.active)return micStream;if(!window.isSecureContext)throw Error('Microphone requires HTTPS on iPhone Safari');if(!navigator.mediaDevices?.getUserMedia)throw Error('Browser microphone API unavailable');micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});return micStream}function applyMute(){if(micStream)micStream.getAudioTracks().forEach(t=>t.enabled=!state.muted)}$('#activateBtn').onclick=async()=>{try{let next=!state.active;if(next)await acquireMic();else if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}let j=await req('/api/activate',{method:'POST',body:JSON.stringify({active:next})});state=j.runtime;applyMute();updateState()}catch(e){add('Activation error',e.message,'err')}};$('#muteBtn').onclick=async()=>{try{if(!state.active)throw Error('Activate Eira first');let j=await req('/api/mute',{method:'POST',body:JSON.stringify({muted:!state.muted})});state=j.runtime;applyMute();updateState()}catch(e){add('Mute error',e.message,'err')}};$('#form').onsubmit=async e=>{e.preventDefault();let i=$('#input'),text=i.value.trim();if(!text)return;add('You',text,'me');i.value='';try{let j=await req('/api/conversation',{method:'POST',body:JSON.stringify({text})}),r=j.result||{};add('Eira',r.text||r.reply||r.response||JSON.stringify(r))}catch(x){add('Conversation bridge',x.message,'err')}};$('#inventBtn').onclick=async()=>{try{let j=await req('/api/invention/launch',{method:'POST',body:'{"action":"launch"}'}),r=j.result||{};if(r.url)location.href=r.url;else add('Invention Lab',r.text||r.status||JSON.stringify(r),'me')}catch(e){add('Invention Lab',e.message,'err')}};$('#arBtn').onclick=async()=>{try{let j=await req('/api/ar/list');if(!j.items.length)throw Error('No verified USDZ artifacts available');let a=j.items[0];location.href=`/api/ar/file/${a.root}/${encodeURIComponent(a.path).replaceAll('%2F','/')}`}catch(e){add('A function dataOf(x){return x&&x.data!==undefined?x.data:x}function nodesOf(x){let d=dataOf(x);return Array.isArray(d)?d:d?.nodes||d?.neurons||[]}function fibersOf(x){let d=dataOf(x);return Array.isArray(d)?d:d?.fibers||d?.edges||[]}function explicitId(n){for(let k of ['id','node_id','name','path'])if(n?.[k]!=null&&String(n[k]).trim())return String(n[k]).trim();return null}function id(n,i){return explicitId(n)||`n${i}`}function score(a){for(let k of ['activity','score','strength','level','weight','value']){let v=Number(a?.[k]);if(Number.isFinite(v))return Math.max(0,Math.min(1,v))}return 1}function coreLike(n){return /core|kernel|supervisor|registry|bridge|orchestr|spine/.test(JSON.stringify(n).toLowerCase())}function ends(f){let a=f?.source??f?.from??f?.a??f?.source_id,b=f?.target??f?.to??f?.b??f?.target_id;return[a==null?null:String(a),b==null?null:String(b)]}function pathTo(target,g,starts){let q=[...starts],prev=new Map(),seen=new Set(starts);while(q.length){let cur=q.shift();if(cur===target){let p=[cur];while(prev.has(cur)){cur=prev.get(cur);p.push(cur)}return p.reverse()}for(let nx of g.get(cur)||[])if(!seen.has(nx)){seen.add(nx);prev.set(nx,cur);q.push(nx)}}return[]}

const cv=$('#brain'),ctx=cv.getContext('2d');let rotY=0,rotX=-.08,drag=false,lx=0,ly=0;function fit(){let d=devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();function hash(s){let h=2166136261;for(let c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}function hemi(n,i){let s=JSON.stringify(n).toLowerCase();if(/left|reason|evidence|memory|analysis|security|learn/.test(s))return-1;if(/right|expression|delivery|voice|speech|render|invent/.test(s))return 1;return i%2?1:-1}function sphere(n,i){let h=hash(id(n,i)),u=(h&65535)/65535,v=((h>>>16)&65535)/65535,phi=Math.acos(1-2*u),theta=2*Math.PI*v,hh=hemi(n,i),x=Math.sin(phi)*Math.cos(theta),y=Math.cos(phi),z=Math.sin(phi)*Math.sin(theta);x=hh*Math.abs(x)*.94;x+=hh*(.08+.08*(1-Math.abs(y)));let r=.72+.26*((hash(id(n,i)+'r')%1000)/1000);return{x:x*r,y:y*r,z:z*r}}function project(p,w,h,R){let cy=Math.cos(rotY),sy=Math.sin(rotY),cx=Math.cos(rotX),sx=Math.sin(rotX),x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy,y=p.y,q={x,y:y*cx-z*sx,z:y*sx+z*cx},pers=1/(1.9-q.z*.34);return{x:w/2+q.x*R*pers,y:h*.49+q.y*R*pers,z:q.z,pers}}function curve(a,b,w,h){return{mx:(a.x+b.x)/2+(w/2-(a.x+b.x)/2)*.16,my:(a.y+b.y)/2+(h*.49-(a.y+b.y)/2)*.12}}function quad(a,c,b,t){let u=1-t;return{x:u*u*a.x+2*u*t*c.mx+t*t*b.x,y:u*u*a.y+2*u*t*c.my+t*t*b.y}}

let labelTimer=null;function hideLabel(){clearTimeout(labelTimer);$('#nodeLabel').classList.remove('show')}function showNodeLabel(n,q,i){let el=$('#nodeLabel'),nid=id(n,i),live=topology.activity.get(nid)||topology.pathNodes.get(nid)||0,role=n.role||n.kind||n.type||n.capability||'canonical neural node';el.innerHTML=`<b>${esc(nid)}</b>${esc(role)}${live?` · LIVE ${Math.round(live*100)}%`:''}`;el.style.left=Math.min(cv.clientWidth-270,Math.max(8,q.x+14))+'px';el.style.top=Math.min(cv.clientHeight-70,Math.max(54,q.y-10))+'px';el.classList.add('show');clearTimeout(labelTimer);labelTimer=setTimeout(hideLabel,5000)}function nearest(x,y){let best=null,dist=26;for(let item of screenNodes){let q=item[1],d=Math.hypot(q.x-x,q.y-y);if(d<dist){dist=d;best=item}}return best}function pointer(e){let r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}cv.onpointerdown=e=>{drag=true;[lx,ly]=pointer(e);cv.setPointerCapture?.(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;let[x,y]=pointer(e);if(Math.abs(x-lx)+Math.abs(y-ly)>3)hideLabel();rotY+=(x-lx)*.009;rotX=Math.max(-1,Math.min(1,rotX+(y-ly)*.006));lx=x;ly=y};cv.onpointerup=e=>{let[x,y]=pointer(e),hit=nearest(x,y);drag=false;if(hit)showNodeLabel(...hit);else hideLabel()};cv.onpointercancel=()=>drag=false;health();loadNeural();setInterval(health,5000);setInterval(loadNeural,1200);
