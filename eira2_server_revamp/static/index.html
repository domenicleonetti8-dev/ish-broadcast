<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EIRA 2.0 — Live Neural Organism</title><style>

</style></head><body><div class="shell"><div class="top"><div class="brand"><h1>EIRA 2.0</h1><small><span id="statusDot" class="dot"></span><span id="headline">QUALIFYING SERVER</span></small></div><div class="actions"><button class="btn gold" id="arBtn">APPLE AR</button><button class="btn violet" id="inventBtn">INVENTION LAB</button></div></div><div class="grid"><section class="card brainCard"><div class="orbGlow"></div><div class="brainHeader"><div><div class="eyebrow">360° LIVE NEURAL ORGANISM</div><div id="brainState">WAITING FOR CANONICAL INVENTORY</div></div><div class="metric"><span id="neurons">0</span> NEURONS<br><strong><span id="fibers">0</span> EVIDENCED FIBERS</strong></div></div><canvas id="brain"></canvas></section><aside class="card side"><div class="title"><h2>Live Conversation</h2><span id="activePill" class="pill">INACTIVE</span></div><div class="actions"><button id="activateBtn" class="btn">ACTIVATE EIRA</button><button id="muteBtn" class="btn">MUTE</button></div><div id="log" class="log"><p class="msg eira"><span class="who">Eira</span>I’m here.</p></div><form id="form" class="compose"><input id="input" autocomplete="off" placeholder="Ask Eira anything…"><button class="btn" type="submit">SEND</button></form><div><div class="eyebrow">BRIDGE MATRIX</div><div id="runtime" class="runtime"></div></div><div id="notice" class="notice">Live activity energizes only canonical nodes and evidenced pathways.</div></aside></div></div><script>
const $=s=>document.querySelector(s),log=$('#log');let state={active:false,muted:false},neural={nodes:[],fibers:[],activity:[]},micStream=null,speakTimer=null;

function add(w,t,k='eira'){let p=document.createElement('p');p.className='msg '+k;p.innerHTML=`<span class="who">${esc(w)}</span>${esc(t)}`;log.appendChild(p);log.scrollTop=log.scrollHeight;if(k==='eira'){document.body.classList.add('speaking');clearTimeout(speakTimer);speakTimer=setTimeout(()=>document.body.classList.remove('speaking'),1800)}}
async function req(u,o={}){let r=await fetch(u,{cache:'no-store',headers:{'Content-Type':'application/json',...(o.headers||{})},...o}),j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||`${r.status} ${r.statusText}`);return j}
function updateState(){$('#activePill').textContent=state.active?(state.muted?'MUTED':'LISTENING'):'INACTIVE';$('#activateBtn').textContent=state.active?'DEACTIVATE EIRA':'ACTIVATE EIRA';$('#muteBtn').textContent=state.muted?'UNMUTE':'MUTE';document.body.classList.toggle('listening',state.active&&!state.muted);document.body.classList.toggle('muted',state.muted)}
function renderBridges(b){let box=$('#runtime');box.innerHTML='';Object.entries(b||{}).forEach(([k,v])=>{let d=document.createElement('div');d.className='r '+(v.healthy?'ok':'bad');d.innerHTML=`<b>${v.healthy?'●':'○'} ${esc(k.replaceAll('_',' ').toUpperCase())}</b><span>${esc(v.detail||'')}</span>`;box.appendChild(d)})}
async function health(){try{let r=await fetch('/api/health',{cache:'no-store'}),j=await r.json();state=j.runtime||state;updateState();renderBridges(j.bridges);$('#statusDot').classList.toggle('ok',!!j.ok);$('#headline').textContent=j.ok?'SERVER QUALIFIED':'SERVER PARTIALLY READY'}catch(e){$('#headline').textContent='SERVER UNREACHABLE'}}
async function acquireMic(){if(micStream&&micStream.active)return micStream;if(!window.isSecureContext)throw Error('Microphone requires HTTPS on iPhone Safari');if(!navigator.mediaDevices?.getUserMedia)throw Error('Browser microphone API unavailable');micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});return micStream}function applyMute(){if(micStream)micStream.getAudioTracks().forEach(t=>t.enabled=!state.muted)}
$('#activateBtn').onclick=async()=>{try{let next=!state.active;if(next)await acquireMic();else if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}let j=await req('/api/activate',{method:'POST',body:JSON.stringify({active:next})});state=j.runtime;applyMute();updateState()}catch(e){add('Activation error',e.message,'err')}};
$('#muteBtn').onclick=async()=>{try{if(!state.active)throw Error('Activate Eira first');let j=await req('/api/mute',{method:'POST',body:JSON.stringify({muted:!state.muted})});state=j.runtime;applyMute();updateState()}catch(e){add('Mute error',e.message,'err')}};
$('#form').onsubmit=async e=>{e.preventDefault();let i=$('#input'),text=i.value.trim();if(!text)return;add('You',text,'me');i.value='';try{let j=await req('/api/conversation',{method:'POST',body:JSON.stringify({text})}),r=j.result||{};add('Eira',r.text||r.reply||r.response||JSON.stringify(r))}catch(x){add('Conversation bridge',x.message,'err')}};
$('#inventBtn').onclick=async()=>{try{let j=await req('/api/invention/launch',{method:'POST',body:'{"action":"launch"}'}),r=j.result||{};if(r.url)location.href=r.url;else add('Invention Lab',r.text||r.status||JSON.stringify(r),'me')}catch(e){add('Invention Lab',e.message,'err')}};$('#arBtn').onclick=async()=>{try{let j=await req('/api/ar/list');if(!j.items.length)throw Error('No verified USDZ artifacts available');let a=j.items[0];location.href=`/api/ar/file/${a.root}/${encodeURIComponent(a.path).replaceAll('%2F','/')}`}catch(e){add('Apple AR',e.message,'err')}};
function dataOf(x){return x&&x.data!==undefined?x.data:x}function nodesOf(x){let d=dataOf(x);return Array.isArray(d)?d:d?.nodes||d?.neurons||[]}function fibersOf(x){let d=dataOf(x);return Array.isArray(d)?d:d?.fibers||d?.edges||[]}
async function loadNeural(){try{let[o,f,a]=await Promise.all([req('/api/neural/overview'),req('/api/neural/fibers'),req('/api/neural/activity')]);neural.nodes=nodesOf(o);neural.fibers=fibersOf(f);neural.activity=nodesOf(a);$('#neurons').textContent=neural.nodes.length;$('#fibers').textContent=neural.fibers.length;$('#brainState').textContent=neural.activity.length?`LIVE ACTIVITY: ${neural.activity.length} ACTIVE NODES`:'SPHERICAL CANONICAL NEURAL FIELD LIVE'}catch(e){$('#brainState').textContent='NEURAL BRIDGE NOT QUALIFIED';neural.nodes=[];neural.fibers=[]}}
const cv=$('#brain'),ctx=cv.getContext('2d');let rotY=0,rotX=-.08,drag=false,lx=0,ly=0;
function fit(){let d=devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();
function hash(s){let h=2166136261;for(let c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}function id(n,i){return n.id||n.node_id||n.name||n.path||`n${i}`}function hemisphere(n,i){let s=JSON.stringify(n).toLowerCase();if(/left|reason|evidence|memory|analysis|security|learn/.test(s))return-1;if(/right|expression|delivery|voice|speech|render|invent/.test(s))return 1;return i%2?1:-1}
function activityScore(a){for(let k of ['activity','score','strength','level','weight','value']){let v=Number(a?.[k]);if(Number.isFinite(v))return Math.max(0,Math.min(1,v))}return 1}
function coreLike(n){return /core|kernel|supervisor|registry|bridge|orchestr|spine/.test(JSON.stringify(n).toLowerCase())}
function edgeEnds(f){return[f.source||f.from||f.a||f.source_id,f.target||f.to||f.b||f.target_id]}
function activityMap(){let m=new Map();neural.activity.forEach((a,i)=>m.set(id(a,i),activityScore(a)));return m}
function graph(){let g=new Map();for(let f of neural.fibers){let[a,b]=edgeEnds(f);if(!a||!b)continue;if(!g.has(a))g.set(a,[]);if(!g.has(b))g.set(b,[]);g.get(a).push(b);g.get(b).push(a)}return g}
function coreIds(){let ids=[];neural.nodes.forEach((n,i)=>{if(coreLike(n))ids.push(id(n,i))});return ids.length?ids:neural.nodes.slice(0,1).map((n,i)=>id(n,i))}
function pathTo(target){let g=graph(),starts=coreIds(),q=[...starts],prev=new Map(),seen=new Set(starts);while(q.length){let cur=q.shift();if(cur===target){let p=[cur];while(prev.has(cur)){cur=prev.get(cur);p.push(cur)}return p.reverse()}for(let nx of g.get(cur)||[]){if(!seen.has(nx)){seen.add(nx);prev.set(nx,cur);q.push(nx)}}}return[]}
function activePaths(){let out=[];for(let a of neural.activity){let target=id(a,0),p=pathTo(target);if(p.length>1)out.push({path:p,strength:activityScore(a)})}return out.slice(0,24)}
function spherePoint(n,i){let h=hash(id(n,i)),u=((h&65535)/65535),v=(((h>>>16)&65535)/65535);let phi=Math.acos(1-2*u),theta=2*Math.PI*v;let hemi=hemisphere(n,i);let x=Math.sin(phi)*Math.cos(theta),y=Math.cos(phi),z=Math.sin(phi)*Math.sin(theta);x=hemi*Math.abs(x)*.94;let fiss=.08+.08*(1-Math.abs(y));x+=hemi*fiss;let r=.72+.26*((hash(id(n,i)+'r')%1000)/1000);return{x:x*r,y:y*r,z:z*r,hemi}}
function rotate(p){let cy=Math.cos(rotY),sy=Math.sin(rotY),cx=Math.cos(rotX),sx=Math.sin(rotX);let x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy,y=p.y;return{x,y:y*cx-z*sx,z:y*sx+z*cx}}
function project(p,w,h,R){let q=rotate(p),pers=1/(1.9-q.z*.34);return{x:w/2+q.x*R*pers,y:h*.49+q.y*R*pers,z:q.z,pers}}
function qcurve(a,b,w,h){return{mx:(a.x+b.x)/2+(w/2-(a.x+b.x)/2)*.16,my:(a.y+b.y)/2+(h*.49-(a.y+b.y)/2)*.12}}
function pointOnQuad(a,c,b,t){let u=1-t;return{x:u*u*a.x+2*u*t*c.mx+t*t*b.x,y:u*u*a.y+2*u*t*c.my+t*t*b.y}}
function draw(){let w=cv.clientWidth,h=cv.clientHeight,R=Math.min(w,h)*.40,t=performance.now()/1000;ctx.clearRect(0,0,w,h);rotY+=.0014;let pts=new Map(),arr=[];neural.nodes.forEach((n,i)=>{let p=spherePoint(n,i),q=project(p,w,h,R);pts.set(id(n,i),q);arr.push([n,q,i])});let amap=activityMap(),paths=activePaths(),pathNodes=new Map(),pathEdges=new Set();paths.forEach(({path,strength})=>{path.forEach((nid,idx)=>pathNodes.set(nid,Math.max(pathNodes.get(nid)||0,strength*(.55+.45*idx/(path.length-1||1)))));for(let i=0;i<path.length-1;i++)pathEdges.add([path[i],path[i+1]].sort().join('|'))});
ctx.save();ctx.translate(w/2,h*.49);for(let k=0;k<5;k++){ctx.beginPath();ctx.ellipse(0,0,R*(.84+k*.035),R*(.82+k*.025),t*.015+k*.31,0,Math.PI*2);ctx.strokeStyle=k%2?'#55efff18':'#b98cff16';ctx.lineWidth=1;ctx.stroke()}ctx.restore();
let prev=null;for(let j=0;j<=34;j++){let yy=-.72+j/34*1.44,ang=j*.62+t*.35,p={x:Math.sin(ang)*.10*(1-Math.abs(yy)*.45),y:yy,z:Math.cos(ang)*.10},q=project(p,w,h,R);if(prev){ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle=j%3?'#ffd16655':'#ff9f4377';ctx.lineWidth=2.2;ctx.shadowBlur=13;ctx.shadowColor='#ffd166';ctx.stroke()}prev=q}ctx.shadowBlur=0;
neural.fibers.forEach((f,i)=>{let[aid,bid]=edgeEnds(f),a=pts.get(aid),b=pts.get(bid);if(!a||!b)return;let key=[aid,bid].sort().join('|'),energized=pathEdges.has(key),pulse=(Math.sin(t*5+i*.71)+1)/2,c=qcurve(a,b,w,h);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(c.mx,c.my,b.x,b.y);ctx.strokeStyle=energized?`rgba(255,209,102,${.42+.5*pulse})`:i%5===0?`rgba(255,209,102,${.12+.2*pulse})`:i%3===0?`rgba(255,101,197,${.10+.18*pulse})`:`rgba(85,239,255,${.09+.2*pulse})`;ctx.lineWidth=energized?1.8+1.6*pulse:.55+.75*pulse;ctx.shadowBlur=energized?16:5;ctx.shadowColor=energized?'#ffd166':'#55efff';ctx.stroke()});ctx.shadowBlur=0;
// live electrons move from canonical core nodes through evidenced routes toward active destinations
paths.forEach(({path,strength},pi)=>{for(let s=0;s<path.length-1;s++){let a=pts.get(path[s]),b=pts.get(path[s+1]);if(!a||!b)continue;let c=qcurve(a,b,w,h),phase=(t*(1.05+strength*.8)+pi*.17+s*.21)%1,p=pointOnQuad(a,c,b,phase),r=2.2+2.8*strength;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=s%3===0?'#ffffff':'#ffd166';ctx.shadowBlur=22+18*strength;ctx.shadowColor=s%2?'#ff9f43':'#55efff';ctx.fill()}});ctx.shadowBlur=0;
arr.sort((a,b)=>a[1].z-b[1].z).forEach(([n,q,i])=>{let nid=id(n,i),direct=amap.get(nid)||0,routed=pathNodes.get(nid)||0,live=Math.max(direct,routed),pulse=.5+.5*Math.sin(t*(5+live*4)+hash(nid)%17),base=q.z>0?.9:.55,r=(1.4+2.5*q.pers)*(1+live*1.7);let col=direct>.01?'#ffd166':routed>.01?'#ff9f43':i%7===0?'#ffd166':i%4===0?'#ff65c5':hemisphere(n,i)<0?'#55efff':'#b98cff';if(live>.01){let halo=16+38*live;ctx.beginPath();ctx.arc(q.x,q.y,r*(3.2+live*2),0,Math.PI*2);let gr=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,r*(3.2+live*2));gr.addColorStop(0,`rgba(255,209,102,${.22+.28*live})`);gr.addColorStop(.45,`rgba(255,101,197,${.08+.12*live})`);gr.addColorStop(1,'rgba(85,239,255,0)');ctx.fillStyle=gr;ctx.fill();ctx.shadowBlur=halo}ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fillStyle=col;ctx.globalAlpha=base*(live>.01?.95:.45+.22*pulse);ctx.shadowBlur=live>.01?24+38*live:8;ctx.shadowColor=col;ctx.fill();ctx.globalAlpha=1});ctx.shadowBlur=0;requestAnimationFrame(draw)}requestAnimationFrame(draw);
function pos(e){let p=e.touches?.[0]||e;return[p.clientX,p.clientY]}cv.onpointerdown=e=>{drag=true;[lx,ly]=pos(e);cv.setPointerCapture?.(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;let[x,y]=pos(e);rotY+=(x-lx)*.009;rotX=Math.max(-1,Math.min(1,rotX+(y-ly)*.006));lx=x;ly=y};cv.onpointerup=()=>drag=false;
health();loadNeural();setInterval(health,5000);setInterval(loadNeural,1200);
