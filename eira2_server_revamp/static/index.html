function dataOf(x){return x&&x.data!==undefined?x.data:x}function nodesOf(x){let d=dataOf(x);return Array.isArray(d)?d:d?.nodes||d?.neurons||[]}function fibersOf(x){let d=dataOf(x);return Array.isArray(d)?d:d?.fibers||d?.edges||[]}

async function loadNeural(){try{let[o,f,a]=await Promise.all([req('/api/neural/overview'),req('/api/neural/fibers'),req('/api/neural/activity')]);neural.nodes=nodesOf(o);neural.fibers=fibersOf(f);neural.activity=nodesOf(a);rebuildTopology();$('#neurons').textContent=neural.nodes.length;$('#fibers').textContent=neural.fibers.length;let live=topology.activity.size;$('#brainState').textContent=live?`LIVE ACTIVITY · ${live} CANONICAL TARGET${live===1?'':'S'} · ${topology.paths.length} CORE ROUTE${topology.paths.length===1?'':'S'}`:'SPHERICAL CANONICAL NEURAL FIELD LIVE'}catch(e){$('#brainState').textContent='NEURAL BRIDGE NOT QUALIFIED';neural.nodes=[];neural.fibers=[];neural.activity=[];rebuildTopology()}}
