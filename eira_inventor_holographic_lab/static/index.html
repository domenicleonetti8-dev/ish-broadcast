<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIRA Inventor Lab V5</title><script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script><style>body{font-family:system-ui;background:#07161c;color:#eaf7fb;margin:0;padding:18px}main{max-width:900px;margin:auto}.card{border:1px solid #31535d;border-radius:22px;padding:18px;margin:14px 0}input,textarea,select,button{font:inherit;background:#0b2028;color:#eef;border:1px solid #456873;border-radius:12px;padding:12px;margin:5px 0;width:100%;box-sizing:border-box}button{font-weight:700}model-viewer{width:100%;height:440px;background:#02090c;border-radius:16px}.muted{color:#9eb8c2}.inv{padding:10px;border-bottom:1px solid #24434c}</style></head><body><main><h1>EIRA Inventor Holographic Lab V5</h1><div class="card"><input id=t placeholder="Invention title"><textarea id=d placeholder="Intent, known dimensions, materials, loads, constraints"></textarea><input id=f type=file accept="image/*"><button id=go>Create / Upload / Build 3D</button><select id=mode><option>engineering_completion</option><option>scientific_plausibility</option><option>faithful_concept</option><option>presentation</option></select><div id=status class=muted>Ready.</div></div><div class="card"><model-viewer id=mv camera-controls auto-rotate shadow-intensity="1"></model-viewer></div><div class="card"><h2>Inventor's Archive</h2><div id=list></div></div></main><script>const $=x=>document.getElementById(x);async function api(p,o){let r=await fetch(p,o?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}:{});let j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}async function refresh(){let xs=await api('/api/inventions');$('list').innerHTML='';for(const x of xs){let e=document.createElement('div');e.className='inv';e.innerHTML=`<b>${x.title}</b> <span class=muted>v${x.version}</span><br><button data-id="${x.id}">Delete</button>`;e.querySelector('button').onclick=async()=>{if(confirm('Delete this invention?')){await api('/api/delete-invention',{invention_id:x.id});refresh()}};$('list').appendChild(e)}}$('go').onclick=async()=>{try{let file=$('f').files[0];if(!file)throw Error('Choose an image');$('status').textContent='Creating invention…';let inv=await api('/api/inventions',{title:$('t').value,description:$('d').value});let b64=await new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(file)});$('status').textContent='Uploading evidence…';await api('/api/upload',{invention_id:inv.id,name:file.name,mime:file.type,data_base64:b64});$('status').textContent='Engineering3D running…';let j=await api('/api/render',{invention_id:inv.id,mode:$('mode').value});let timer=setInterval(async()=>{let q=await api('/api/jobs/'+j.job_id);$('status').textContent='Render: '+q.status+(q.error?' — '+q.error:'');if(['completed','failed','cancelled'].includes(q.status)){clearInterval(timer);if(q.model_url){$('mv').src=q.model_url;$('status').textContent='Completed — interactive model loaded'}refresh()}},1500)}catch(e){$('status').textContent='ERROR: '+e.message}};refresh();</script></body></html>
