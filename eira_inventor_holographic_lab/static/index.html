<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>EIRA Inventor Lab V6</title><script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script><style>body{font-family:system-ui;background:#07161c;color:#eaf7fb;margin:0;padding:18px}main{max-width:900px;margin:auto}.card{border:1px solid #31535d;border-radius:22px;padding:18px;margin:14px 0}input,textarea,select,button,a.ar{font:inherit;background:#0b2028;color:#eef;border:1px solid #456873;border-radius:12px;padding:12px;margin:5px 0;width:100%;box-sizing:border-box}button,a.ar{font-weight:700}a.ar{display:block;text-align:center;text-decoration:none}.hidden{display:none!important}model-viewer{width:100%;height:440px;background:#02090c;border-radius:16px}.muted{color:#9eb8c2}.inv{padding:10px;border-bottom:1px solid #24434c}.good{color:#8ee6ad}</style></head><body><main><h1>EIRA Inventor Holographic Lab V6</h1><div class="card"><input id=t placeholder="Invention title"><textarea id=d placeholder="Intent, known dimensions, materials, loads, constraints, electronics, programming, behavior"></textarea><input id=f type=file accept="image/*" multiple><div class=muted>Submit every useful angle, drawing, diagram, close-up, PCB view, connector view, fastener view, or reference photo. All images are treated as evidence for one invention.</div><button id=go>Create / Upload All Photos / Build</button><select id=mode><option>engineering_completion</option><option>scientific_plausibility</option><option>faithful_concept</option><option>presentation</option></select><div id=status class=muted>Ready.</div></div><div class="card"><model-viewer id=mv camera-controls auto-rotate shadow-intensity="1"></model-viewer><a id=ar class="ar hidden" rel="ar">Open Walkable Apple AR</a><a id=bp class="ar hidden" target="_blank">Open Engineering Blueprint Master</a></div><div class="card"><h2>Inventor's Archive</h2><div id=list></div></div></main><script>const $=x=>document.getElementById(x);async function api(p,o){let r=await fetch(p,o?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}:{});let j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}async function b64(file){return await new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(file)})}async function refresh(){let xs=await api('/api/inventions');$('list').innerHTML='';for(const x of xs){let e=document.createElement('div');e.className='inv';e.innerHTML=`<b>${x.title}</b> <span class=muted>v${x.version} · ${(x.assets||[]).length} evidence files</span><br><button data-id="${x.id}">Delete</button>`;e.querySelector('button').onclick=async()=>{if(confirm('Delete this invention?')){await api('/api/delete-invention',{invention_id:x.id});refresh()}};$('list').appendChild(e)}}$('go').onclick=async()=>{try{let files=[...$('f').files];if(!files.length)throw Error('Choose one or more images');$('go').disabled=true;$('ar').classList.add('hidden');$('bp').classList.add('hidden');$('status').textContent='Creating invention…';let inv=await api('/api/inventions',{title:$('t').value,description:$('d').value});for(let i=0;i<files.length;i++){$('status').textContent=`Uploading evidence ${i+1}/${files.length}: ${files[i].name}`;await api('/api/upload',{invention_id:inv.id,name:files[i].name,mime:files[i].type||'image/jpeg',data_base64:await b64(files[i]),kind:'source'})}$('status').textContent=`Engineering from ${files.length} evidence view(s)…`;let j=await api('/api/render',{invention_id:inv.id,mode:$('mode').value});let timer=setInterval(async()=>{let q=await api('/api/jobs/'+j.job_id);$('status').textContent='Build: '+q.status+(q.source_image_count?` · ${q.source_image_count} views`:'')+(q.error?' — '+q.error:'');if(['completed','failed','cancelled'].includes(q.status)){clearInterval(timer);$('go').disabled=false;if(q.model_url){$('mv').src=q.model_url}if(q.usdz_url){$('ar').href=q.usdz_url;$('ar').classList.remove('hidden')}if(q.blueprint_master_url){$('bp').href=q.blueprint_master_url;$('bp').classList.remove('hidden')}if(q.status==='completed'){$('status').className='good';$('status').textContent=`Completed from ${q.source_image_count||files.length} evidence view(s) — 3D, blueprints and Apple AR ready`}refresh()}},1500)}catch(e){$('go').disabled=false;$('status').className='muted';$('status').textContent='ERROR: '+e.message}};refresh();</script></body></html>
